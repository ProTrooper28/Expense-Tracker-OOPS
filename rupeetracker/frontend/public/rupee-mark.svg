<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Rupee Tracker</title>
  <desc id="desc">A rupee coin with a rising mint accent.</desc>
  <defs>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#89f0d0"/>
      <stop offset="1" stop-color="#53c9ab"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c591ef"/>
      <stop offset="1" stop-color="#5ce0c5"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="68" fill="#111214"/>
  <circle cx="128" cy="128" r="88" fill="#202225" stroke="#36383d" stroke-width="3"/>
  <circle cx="128" cy="128" r="76" fill="none" stroke="url(#ring)" stroke-width="5" opacity=".88"/>
  <text x="119" y="163" text-anchor="middle" font-family="Inter, Noto Sans, Arial, sans-serif" font-size="96" font-weight="750" fill="url(#mint)">₹</text>
  <path d="M171 177v-35m0 0-15 15m15-15 15 15" fill="none" stroke="#d1a0ef" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
